<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — Keychecker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            </span>
            <span class="brand-name">Keychecker</span>
        </a>
        <a href="/" class="nav-link">Key Check</a>
        <a href="/config" class="nav-link">Config</a>
        <a href="/quality" class="nav-link">Quality Test</a>
        <a href="/history" class="nav-link active">History</a>
    </nav>

    <div class="container">
        <header>
            <h1>
                <span class="header-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                Test History
            </h1>
            <p class="subtitle">View past quality test results and trends</p>
        </header>

        <section class="card animate-in-delay-1">
            <div class="section-header">
                <h3>Test Runs</h3>
                <div>
                    <select id="hist-filter-endpoint" class="filter-select">
                        <option value="">All Endpoints</option>
                    </select>
                    <button class="btn-secondary" id="hist-refresh-btn">Refresh</button>
                </div>
            </div>
            <div id="hist-runs"></div>
        </section>
    </div>

    <!-- Run Detail Modal -->
    <div id="run-detail-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>Test Run Detail</h3>
                <button class="modal-close" id="close-run-detail-btn">&times;</button>
            </div>
            <div id="run-detail-content"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="close-run-detail-btn2">Close</button>
            </div>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/history.js"></script>
</body>
</html>
