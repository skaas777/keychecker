<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Test — Keychecker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            </span>
            <span class="brand-name">Keychecker</span>
        </a>
        <a href="/" class="nav-link">Key Check</a>
        <a href="/config" class="nav-link">Config</a>
        <a href="/quality" class="nav-link active">Quality Test</a>
        <a href="/history" class="nav-link">History</a>
    </nav>

    <div class="container">
        <header>
            <h1>
                <span class="header-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </span>
                Quality Testing
            </h1>
            <p class="subtitle">Test model authenticity, capability, latency, and anomaly detection</p>
        </header>

        <!-- Test Configuration -->
        <section class="card animate-in-delay-1">
            <div class="section-header">
                <h3>Test Configuration</h3>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Endpoint</label>
                    <select id="qt-endpoint">
                        <option value="">Select endpoint...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select id="qt-model">
                        <option value="">Select endpoint first...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Test Tier</label>
                    <select id="qt-tier">
                        <option value="1">Tier 1: Smoke (9 calls, ~15s)</option>
                        <option value="2" selected>Tier 2: Standard (45 calls, ~60s)</option>
                        <option value="3">Tier 3: Deep (150 calls, ~5min)</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" id="qt-start-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <span id="qt-start-btn-label">Start Quality Test</span>
            </button>
        </section>

        <!-- Progress -->
        <section id="qt-progress" class="card hidden">
            <div class="section-header">
                <h3>Progress</h3>
                <span id="qt-progress-status" class="status-badge">Running...</span>
            </div>
            <div class="progress-log" id="qt-progress-log"></div>
        </section>

        <!-- Results -->
        <section id="qt-results" class="hidden">
            <!-- Overall Score -->
            <div class="card" id="qt-overall">
                <div class="section-header">
                    <h3>Overall Result</h3>
                    <span id="qt-status-badge" class="status-badge"></span>
                </div>
                <div class="score-display">
                    <div class="score-circle" id="qt-score-circle"></div>
                    <div id="qt-summary" class="score-summary"></div>
                </div>
                <div id="qt-flags" class="flags-list"></div>
            </div>

            <!-- Authenticity -->
            <div class="card" id="qt-authenticity">
                <h3>Model Authenticity</h3>
                <div id="qt-auth-content"></div>
            </div>

            <!-- Capability -->
            <div class="card" id="qt-capability">
                <h3>Capability Benchmarks</h3>
                <div id="qt-cap-content"></div>
            </div>

            <!-- Latency -->
            <div class="card" id="qt-latency">
                <h3>Latency & Performance</h3>
                <div id="qt-lat-content"></div>
            </div>

            <!-- Anomalies -->
            <div class="card" id="qt-anomalies">
                <h3>Anomaly Detection</h3>
                <div id="qt-anom-content"></div>
            </div>
        </section>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/quality.js"></script>
</body>
</html>
