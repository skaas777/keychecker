<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keychecker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            </span>
            <span class="brand-name">Keychecker</span>
        </a>
        <a href="/" class="nav-link active">Key Check</a>
        <a href="/config" class="nav-link">Config</a>
        <a href="/quality" class="nav-link">Quality Test</a>
        <a href="/history" class="nav-link">History</a>
    </nav>

    <div class="container">
        <header>
            <h1>
                <span class="header-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                </span>
                Key Check
            </h1>
            <p class="subtitle">Bulk API key checker for AI services</p>
        </header>

        <!-- Input Section -->
        <section class="input-section animate-in-delay-1">
            <div class="input-group">
                <label for="keys-input">Paste API keys (one per line)</label>
                <textarea id="keys-input" rows="10" placeholder="sk-...&#10;sk-ant-...&#10;AKIA...:...&#10;resource:apikey&#10;xai-..."></textarea>
            </div>

            <div class="input-group">
                <label for="keys-file">Or upload a key file</label>
                <input type="file" id="keys-file" accept=".txt,.csv,.text">
            </div>

            <div class="input-group">
                <label for="vertex-file">Vertex AI service account JSON (optional)</label>
                <input type="file" id="vertex-file" accept=".json">
            </div>

            <div class="options-group">
                <label><input type="checkbox" id="awslegacy"> AWS Legacy mode</label>
                <label><input type="checkbox" id="verifyorg"> Verify OpenAI org</label>
                <label><input type="checkbox" id="proxyoutput"> Proxy output format</label>
            </div>

            <button id="check-btn" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <span id="check-btn-label">Start Check</span>
            </button>
            <button id="clear-btn" class="btn-secondary">Clear</button>
        </section>

        <!-- Progress Section -->
        <section id="progress-section" class="hidden">
            <div class="section-header">
                <h3>Progress</h3>
                <span id="progress-status" class="status-badge">Running...</span>
            </div>
            <div id="progress-log" class="progress-log"></div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="hidden">
            <div class="section-header">
                <h3>Results</h3>
                <div class="view-toggle">
                    <button id="view-structured" class="toggle-btn active">Structured</button>
                    <button id="view-proxy" class="toggle-btn">Proxy Format</button>
                    <button id="view-text" class="toggle-btn">Text View</button>
                </div>
            </div>

            <!-- Summary -->
            <div id="summary" class="summary-card"></div>

            <!-- Structured view -->
            <div id="structured-view">
                <div id="results-content"></div>
            </div>

            <!-- Proxy view -->
            <div id="proxy-view" class="hidden">
                <pre id="proxy-output"></pre>
                <button class="btn-copy" data-copy-target="proxy-output">Copy</button>
            </div>

            <!-- Text view -->
            <div id="text-view" class="hidden">
                <pre id="text-output"></pre>
                <button class="btn-copy" data-copy-target="text-output">Copy</button>
            </div>
        </section>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
